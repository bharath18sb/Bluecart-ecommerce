{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<section class="card form-card auth-card">
  <h1>Create your account</h1>
  <p class="muted">It only takes a minute.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include 'store/_form_fields.html' %}
    <button type="submit" class="btn btn-primary btn-block btn-lg">Register</button>
  </form>
  <p class="auth-alt">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</section>
{% endblock %}
